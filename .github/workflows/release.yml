# Release firmado de Amazon Fill (paso s32 del plan de instalacion; GDD 08 sec. 12.1 etapas 3-4 y sec. 13.1 #1 y #3).
# Guia del dueno: docs/dev/release.md. Reglas: .claude/rules/ci.md.
#
# Lo lanza SOLO el dueno, a mano (Actions > Release firmado > Run workflow, rama main). Construye el AAB de release
# firmado con la clave de subida, pasa las compuertas de release y lo deja como artefacto de la ejecucion. NO lo sube a
# Google Play: publica el dueno (CLAUDE.md, regla dura 6; 08 sec. 12.1 etapa 5, bloqueada hasta el dictamen de marca).
#
#   preflight  sin Unity ni licencia (1 min): rama main, applicationId de la variable de repositorio
#              AF_RELEASE_APPLICATION_ID (falla cerrado si falta, si es el provisional com.amazonfill.dev o si lleva
#              "amazon"), los seis secretos presentes, versionName y versionCode validos, y el keystore se abre con su
#              contrasena y tiene el alias (ci/release-preflight.sh y ci/check-release-signature.sh --keystore-only).
#   build      AF.EditorTools.BuildRelease.BuildAndroid -afRequireSigning (IL2CPP ARM64, Managed Stripping High, sin
#              Development Build) y las compuertas: size-gate -RequireBundletool, check-16kb con
#              CHECK16_REQUIRE_ZIPALIGN=1, check-manifest -Mode release -RequireBilling, check-release-classes,
#              check-no-unity-iap, applicationId y version del manifiesto, y la firma (ci/check-release-signature.sh).
#
# Secretos (los crea el dueno; aqui solo se referencian, nunca con echo): UNITY_EMAIL y UNITY_PASSWORD en el
# repositorio; ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEYALIAS_NAME y ANDROID_KEYALIAS_PASS en el
# Environment "release" de GitHub (limitado a main y, si el dueno quiere, con un revisor obligatorio). Los dos jobs
# declaran environment: release: es la barrera que no depende del contenido de este archivo, porque los secretos del
# Environment solo llegan a jobs de main que lo declaran (y, con revisor, tras su aprobacion).
# Variable de repositorio (no secreta): AF_RELEASE_APPLICATION_ID, solo tras el dictamen de marca (D-034, D-041).
#
# El keystore: en el preflight se decodifica con umask 077 en $RUNNER_TEMP. En el build va a
# $GITHUB_WORKSPACE/.af-signing/ (ignorado por git, fuera de Assets/ y de toda cache: la de Library solo se restaura y
# la de LFS solo guarda .git/lfs), porque el contenedor de game-ci v6 solo ve el workspace, en /github/workspace (no
# monta $RUNNER_TEMP/_github_home como /root: primera ejecucion del 2026-10-27, codigo 9). Se borra al acabar (paso con
# if: always()). Las contrasenas llegan a BuildRelease por las variables ANDROID_* que game-ci pasa al contenedor.
#
# Cache de Library: SOLO se restaura (actions/cache/restore), nunca se guarda: Unity escribe la configuracion de firma,
# contrasenas incluidas, en el proyecto Gradle de Library/Bee, y una cache guardada la podria leer cualquier workflow
# del repositorio.
#
# Licencia Personal: job de Unity en el grupo unity-personal-seat, en serie con ci.yml.

name: Release firmado

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'versionName MAYOR.MENOR.PARCHE (p. ej. 1.0.0)'
        required: true
        type: string
      versionCode:
        description: 'versionCode (entero > 0, mayor que el ultimo subido a Play). Vacio: MAYOR*10000 + MENOR*100 + PARCHE'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Comprobaciones previas (sin Unity)
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 10
    outputs:
      application_id: ${{ steps.check.outputs.application_id }}
      version_name: ${{ steps.check.outputs.version_name }}
      version_code: ${{ steps.check.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          lfs: false

      - id: check
        name: Rama, applicationId, secretos y version
        env:
          AF_GIT_REF: ${{ github.ref }}
          AF_RELEASE_APPLICATION_ID: ${{ vars.AF_RELEASE_APPLICATION_ID }}
          AF_VERSION_NAME: ${{ inputs.versionName }}
          AF_VERSION_CODE: ${{ inputs.versionCode }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: bash ci/release-preflight.sh

      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: El keystore se abre y tiene el alias
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
        run: |
          set -euo pipefail
          umask 077
          export AF_KEYSTORE_PATH="$RUNNER_TEMP/af-preflight.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$AF_KEYSTORE_PATH"
          bash ci/check-release-signature.sh --keystore-only

      - name: Borrar el keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/af-preflight.keystore"

  build:
    name: Build Android firmado + compuertas
    needs: preflight
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 120
    concurrency:
      group: unity-personal-seat
      cancel-in-progress: false
    env:
      AF_APPLICATION_ID: ${{ needs.preflight.outputs.application_id }}
      AF_VERSION_NAME: ${{ needs.preflight.outputs.version_name }}
      AF_VERSION_CODE: ${{ needs.preflight.outputs.version_code }}
      BUNDLETOOL_VERSION: 1.17.2
      # sha256 de bundletool-all-1.17.2.jar (el mismo que en ci.yml).
      BUNDLETOOL_SHA256: 2d4ad908faea64047c1cc9cb747e6aa667c6ab192e09607bd16b67246a8cd6ae
    steps:
      - name: Espacio en disco (la imagen Android de Unity ocupa mucho)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          docker image prune -af
          df -h /

      - uses: actions/checkout@v4.2.2
        with:
          lfs: false

      - name: Lista de objetos LFS
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Cache de LFS
        uses: actions/cache@v4.2.3
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-

      - name: git lfs pull
        run: git lfs pull

      # Solo restaurar: ver la cabecera (la firma acaba en Library/Bee).
      - name: Cache de Library (solo lectura; la de build-android de ci.yml)
        uses: actions/cache/restore@v4.2.3
        with:
          path: Library
          key: Library-android-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/**', 'Assets/**') }}
          restore-keys: Library-android-

      - name: Keystore de subida en un temporal fuera del repositorio
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$GITHUB_WORKSPACE/.af-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/.af-signing/af-upload.keystore"
          test -s "$GITHUB_WORKSPACE/.af-signing/af-upload.keystore"

      # game-ci v6 sale con 1 aunque el build termine bien: falla al devolver la licencia Personal por derechos
      # («Serial number unavailable for ULF return»; primera ejecucion completa, 2026-10-27: [AF.BuildRelease] OK,
      # 59,18 MB, y despues validateBuild con 1). Por eso el paso no corta el job: el veredicto lo dan el AAB y las
      # compuertas de abajo (firma, identidad y version, bundletool, 16 KB y manifiesto), que un AAB a medias no pasa.
      - name: Build Android (AAB de release firmado)
        id: unitybuild
        continue-on-error: true
        uses: game-ci/unity-builder@v6.0.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          cliVersion: v0.1.72
          customImage: unityci/editor:ubuntu-6000.3.25f1-android-3
          buildMethod: AF.EditorTools.BuildRelease.BuildAndroid
          androidExportType: androidAppBundle
          androidVersionCode: ${{ needs.preflight.outputs.version_code }}
          versioning: None
          # Ruta dentro del contenedor de game-ci (el workspace se monta en /github/workspace).
          androidKeystoreName: /github/workspace/.af-signing/af-upload.keystore
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          customParameters: -afApplicationId ${{ needs.preflight.outputs.application_id }} -afVersionName ${{ needs.preflight.outputs.version_name }} -afRequireSigning

      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: bundletool (version fijada y sha256 comprobado)
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          curl -fsSL -o "$jar" "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          echo "${BUNDLETOOL_SHA256}  $jar" | sha256sum -c -
          echo "BUNDLETOOL_JAR=$jar" >> "$GITHUB_ENV"

      - name: Un solo AAB
        env:
          AF_UNITY_OUTCOME: ${{ steps.unitybuild.outcome }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          echo "Resultado del paso de game-ci: $AF_UNITY_OUTCOME (el veredicto lo dan el AAB y las compuertas)."
          aabs=(build/Android/*.aab)
          if [ "${#aabs[@]}" -ne 1 ]; then
            echo "Se esperaba un .aab en build/Android y hay ${#aabs[@]}: el build de Unity no termino." >&2
            exit 1
          fi
          echo "AF_AAB=${aabs[0]}" >> "$GITHUB_ENV"

      - name: Compuerta de firma (clave de subida, no la de depuracion)
        env:
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
        run: AF_KEYSTORE_PATH="$GITHUB_WORKSPACE/.af-signing/af-upload.keystore" bash ci/check-release-signature.sh "$AF_AAB"

      - name: Compuerta de identidad y version del manifiesto
        run: |
          set -euo pipefail
          dump() { java -jar "$BUNDLETOOL_JAR" dump manifest --bundle "$AF_AAB" --xpath "$1" | tr -d '\r\n'; }
          pkg="$(dump /manifest/@package)"
          code="$(dump /manifest/@android:versionCode)"
          name="$(dump /manifest/@android:versionName)"
          echo "package=$pkg versionCode=$code versionName=$name"
          [ "$pkg" = "$AF_APPLICATION_ID" ] || { echo "package $pkg distinto de $AF_APPLICATION_ID" >&2; exit 1; }
          [ "$code" = "$AF_VERSION_CODE" ] || { echo "versionCode $code distinto de $AF_VERSION_CODE" >&2; exit 1; }
          [ "$name" = "$AF_VERSION_NAME" ] || { echo "versionName $name distinto de $AF_VERSION_NAME" >&2; exit 1; }

      - name: Compuerta de tamano (<= 80 MB, bundletool get-size total)
        run: pwsh -NoProfile -File ci/size-gate.ps1 build/Android -RequireBundletool -Breakdown

      - name: Compuerta de 16 KB
        env:
          CHECK16_REQUIRE_ZIPALIGN: '1'
        run: bash ci/check-16kb.sh "$AF_AAB"

      - name: Compuerta del manifiesto (release, con Play Billing)
        run: pwsh -NoProfile -File ci/check-manifest.ps1 build/Android -Mode release -RequireBilling

      - name: Compuerta de clases prohibidas en release (firebase-appcheck-debug)
        run: pwsh -NoProfile -File ci/check-release-classes.ps1 build/Android

      - name: Compuerta sin Unity IAP (com.unity.purchasing ni su telemetria)
        run: pwsh -NoProfile -File ci/check-no-unity-iap.ps1 build/Android

      # Artefacto de la ejecucion; NO se sube a Google Play (lo hace el dueno a mano).
      - name: AAB de release
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-aab-release-${{ needs.preflight.outputs.version_name }}-${{ needs.preflight.outputs.version_code }}
          path: build/Android/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Borrar el keystore
        if: always()
        run: |
          ks="$GITHUB_WORKSPACE/.af-signing/af-upload.keystore"
          if [ -f "$ks" ]; then
            shred -u "$ks" 2> /dev/null || rm -f "$ks"
          fi
          test ! -e "$ks"
