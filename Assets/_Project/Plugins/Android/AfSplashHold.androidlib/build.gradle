// Plugin propio que retiene la pantalla de arranque del sistema hasta la intro de la marca (añadido de D-051 del 2026-10-28).
// Solo Java y solo API de la plataforma (android.*): sin androidx, sin dependencias ni permisos. Un ContentProvider sin exportar
// (AfSplashHoldProvider) registra unas ActivityLifecycleCallbacks al arrancar el proceso; al empezar la actividad de Unity, un
// OnPreDrawListener en su ventana devuelve false hasta que el juego avisa por JNI (AF.UI.AndroidOsSplash.Release) de que la intro
// ya está en la pantalla, con un tope de 3 s. Mientras, Unity corre sin el foco de la ventana (UnityPlayer.setRunWithoutFocus),
// porque Android no da el foco a una ventana que aún no se ha pintado. Detalle en docs/dev/decisiones.md (D-051, añadido del
// 2026-10-28, la pantalla del sistema hasta la intro) y en el test AfSplashHoldPluginTests.
apply plugin: 'com.android.library'

android {
    namespace 'com.amazonfill.splash'
    compileSdk 36

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'proguard-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
