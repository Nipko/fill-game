// Plugin propio del foco de audio (observación 10 de la jornada 6: con una alarma sonando, la música del juego seguía). Solo Java y
// solo API de la plataforma (android.media): sin androidx, sin dependencias ni permisos (pedir el foco de audio no necesita
// ninguno). El juego pide el foco con AudioFocusRequest (API 26, el minSdk) y USAGE_GAME, y Android le avisa cuando otro lo toma
// (una alarma, una llamada, un aviso de voz): AF.Audio.Unity.AndroidAudioFocus lo recibe por un AndroidJavaProxy y
// UnityAudioService baja la música al 20 % o pausa la música y los efectos. Detalle en docs/dev/decisiones.md (D-026, añadido del 2026-10-29) y en el test
// AfAudioFocusPluginTests.
apply plugin: 'com.android.library'

android {
    namespace 'com.amazonfill.audiofocus'
    compileSdk 36

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'proguard-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
