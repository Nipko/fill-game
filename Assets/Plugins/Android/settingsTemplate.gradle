pluginManagement {
    repositories {
        **ARTIFACTORYREPOSITORY**
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

include ':launcher', ':unityLibrary'
**INCLUDES**

// Amazon Fill (D-033, anadido del 2026-10-22, punto 9; docs/dev/firebase-cliente.md sec. 4): firebase-appcheck-debug,
// el proveedor de depuracion de App Check, solo en los builds de desarrollo. Unity construye la variante "debug" de
// Gradle con Development Build (BuildDev, que define DEVELOPMENT_BUILD y usa DebugAppCheckProviderFactory) y la
// "release" sin el (BuildRelease, con y sin -afRehearsal, que usa Play Integrity). La exclusion actua al resolver
// cada configuracion "release*" de todos los modulos, asi que vale aunque EDM4U vuelva a escribir la dependencia en
// su bloque de mainTemplate.gradle. Va fuera de los bloques "Android Resolver" de EDM4U. Compuerta:
// ci/check-release-classes.ps1.
gradle.beforeProject { p ->
    p.configurations.configureEach { c ->
        if (c.name.startsWith('release')) {
            c.exclude(group: 'com.google.firebase', module: 'firebase-appcheck-debug')
        }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        **ARTIFACTORYREPOSITORY**
        google()
        mavenCentral()
// Android Resolver Repos Start
        def unityProjectPath = $/file:///**DIR_UNITYPROJECT**/$.replace("\\", "/")
        maven {
            url "https://maven.google.com/" // Packages/com.google.ads.mobile/GoogleMobileAds/Editor/GoogleUmpDependencies.xml:7, Packages/com.google.ads.mobile/GoogleMobileAds/Editor/GoogleMobileAdsDependencies.xml:7, Packages/com.google.ads.mobile/GoogleMobileAds/Editor/GoogleMobileAdsDependencies.xml:12, Packages/com.google.ads.mobile/GoogleMobileAds/Editor/GoogleMobileAdsDependencies.xml:17, Packages/com.google.ads.mobile/GoogleMobileAds/Editor/GoogleMobileAdsDependencies.xml:22, Packages/com.google.play.games/Editor/GooglePlayGamesPluginDependencies.xml:9, Packages/com.google.play.games/Editor/GooglePlayGamesPluginDependencies.xml:14
        }
        maven {
            url (unityProjectPath + "/Assets/GeneratedLocalRepo/Firebase/m2repository") // Packages/com.google.firebase.app/Firebase/Editor/AppDependencies.xml:25, Packages/com.google.firebase.app-check/Firebase/Editor/AppCheckDependencies.xml:27, Packages/com.google.firebase.auth/Firebase/Editor/AuthDependencies.xml:23, Packages/com.google.firebase.crashlytics/Firebase/Editor/CrashlyticsDependencies.xml:23, Packages/com.google.firebase.remote-config/Firebase/Editor/RemoteConfigDependencies.xml:23, Packages/com.google.firebase.analytics/Firebase/Editor/AnalyticsDependencies.xml:21
        }
        mavenLocal()
// Android Resolver Repos End
        flatDir {
            dirs "${project(':unityLibrary').projectDir}/libs"
        }
    }
}
