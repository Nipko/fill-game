<svg class="hero-svg" xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 420 300" width="400" height="300" aria-hidden="true" focusable="false">
  <!-- Portada de tintalu.com: una cuia vierte su capa roja en otra hasta completarla, y se sella (02 §1, modo run, D-005).
       Va en línea en la portada (marcador hero-art); la animación está en site.css (.hero-svg), porque la CSP no deja estilos
       en línea. Sin movimiento si el sistema lo pide (prefers-reduced-motion). -->
  <defs>
    <path id="tube" d="M0 0 H50 V128 a25 25 0 0 1 -50 0 Z"/>
    <clipPath id="in1" clipPathUnits="userSpaceOnUse"><use href="#tube" x="40" y="100"/></clipPath>
    <clipPath id="in2" clipPathUnits="userSpaceOnUse"><use href="#tube" x="130" y="100"/></clipPath>
    <clipPath id="in3" clipPathUnits="userSpaceOnUse"><use href="#tube" x="220" y="100"/></clipPath>
    <clipPath id="in4" clipPathUnits="userSpaceOnUse"><use href="#tube" x="310" y="100"/></clipPath>
  </defs>

  <rect class="shelf" x="20" y="262" width="360" height="12" rx="6"/>

  <!-- Cuia 2: tres rojas; recibe la cuarta y se sella -->
  <g clip-path="url(#in2)">
    <rect x="130" y="216" width="50" height="40" fill="#c9373a"/>
    <rect x="130" y="180" width="50" height="36" fill="#c9373a"/>
    <rect x="130" y="144" width="50" height="36" fill="#c9373a"/>
    <rect class="take" x="130" y="108" width="50" height="36" fill="#c9373a"/>
    <circle class="bubble" cx="146" cy="240" r="3" fill="#ffffff" fill-opacity="0.6"/>
  </g>
  <use href="#tube" x="130" y="100" class="glass"/>
  <rect class="shine" x="137" y="110" width="6" height="110" rx="3"/>
  <g class="seal"><rect class="cork" x="128" y="86" width="54" height="16" rx="5"/></g>
  <path class="spark" fill="#ffe08a" d="M155 50 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 Z"/>

  <!-- Cuia 3: mezclada -->
  <g clip-path="url(#in3)">
    <rect x="220" y="216" width="50" height="40" fill="#5a2d6e"/>
    <rect x="220" y="180" width="50" height="36" fill="#f2a33a"/>
    <rect x="220" y="144" width="50" height="36" fill="#3f9e5a"/>
    <rect x="220" y="108" width="50" height="36" fill="#5a2d6e"/>
    <circle class="bubble b2" cx="238" cy="240" r="3" fill="#ffffff" fill-opacity="0.6"/>
  </g>
  <use href="#tube" x="220" y="100" class="glass"/>
  <rect class="shine" x="227" y="110" width="6" height="110" rx="3"/>

  <!-- Cuia 4: a medias -->
  <g clip-path="url(#in4)">
    <rect x="310" y="216" width="50" height="40" fill="#3f9e5a"/>
    <rect x="310" y="180" width="50" height="36" fill="#f2a33a"/>
    <circle class="bubble b3" cx="330" cy="240" r="3" fill="#ffffff" fill-opacity="0.6"/>
  </g>
  <use href="#tube" x="310" y="100" class="glass"/>
  <rect class="shine" x="317" y="110" width="6" height="110" rx="3"/>

  <!-- El chorro, de la boca de la cuia 1 a la cuia 2 -->
  <rect class="stream" x="151" y="82" width="7" height="62" rx="3.5" fill="#c9373a"/>

  <!-- Cuia 1: naranja, morada y roja arriba; se inclina sobre la cuia 2 y vierte la roja -->
  <g class="pour">
    <g clip-path="url(#in1)">
      <rect x="40" y="216" width="50" height="40" fill="#f2a33a"/>
      <rect x="40" y="180" width="50" height="36" fill="#5a2d6e"/>
      <rect class="give" x="40" y="144" width="50" height="36" fill="#c9373a"/>
    </g>
    <use href="#tube" x="40" y="100" class="glass"/>
    <rect class="shine" x="47" y="110" width="6" height="110" rx="3"/>
  </g>
</svg>
